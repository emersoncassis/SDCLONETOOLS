name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Teste do motor de recuperação
        run: gcc -O1 -o test_core test_core.c && ./test_core

      - name: Instalar o Zig
        run: pip install ziglang

      - name: Compilar (64 e 32 bits)
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SDCloneTools
          path: |
            SDCloneTools.exe
            SDCloneTools32.exe

      - name: Publicar release (em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SDCloneTools.exe
            SDCloneTools32.exe
