name: build

on:
  push:
    branches: [main]
    paths:
      - 'sdclone.c'
      - 'core.h'
      - 'sdclone.rc'
      - 'sdclone.manifest'
      - 'mkicon.py'
      - 'build.sh'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex.: v1.1.0). Vazio = v1.0.<número da execução>'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Teste do motor de recuperação
        run: gcc -O1 -o test_core test_core.c && ./test_core

      - name: Instalar o Zig
        run: pip install ziglang

      - name: Compilar (64 e 32 bits)
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SDCloneTools
          path: |
            SDCloneTools.exe
            SDCloneTools32.exe

      - name: Publicar release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || format('v1.0.{0}', github.run_number) }}
          name: SDCLONETOOLS ${{ inputs.version || format('v1.0.{0}', github.run_number) }}
          make_latest: true
          generate_release_notes: true
          files: |
            SDCloneTools.exe
            SDCloneTools32.exe
